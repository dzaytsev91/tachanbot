version: v1.0
name: CI/CD пайплайн
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
global_job_config:
  prologue:
    commands:
      - checkout
blocks:
  - name: Docker сборка и тестирование
    task:
      jobs:
        - name: Build и test
          commands:
            - 'docker build -t "my-app:$SEMAPHORE_WORKFLOW_ID" .'
            - 'docker run --rm "my-app:$SEMAPHORE_WORKFLOW_ID" pytest'
  - name: Публикация Docker образа
    dependencies:
      - Docker сборка и тестирование
    task:
      jobs:
        - name: Push в Semaphore Registry
          commands:
            - 'test -n "$SEMAPHORE_REGISTRY_USERNAME" || { echo "SEMAPHORE_REGISTRY_USERNAME is empty"; exit 1; }'
            - 'test -n "$SEMAPHORE_REGISTRY_PASSWORD" || { echo "SEMAPHORE_REGISTRY_PASSWORD is empty"; exit 1; }'
            - 'test -n "$SEMAPHORE_REGISTRY_URL" || { echo "SEMAPHORE_REGISTRY_URL is empty"; exit 1; }'
            - echo "$SEMAPHORE_REGISTRY_PASSWORD" | docker login "$SEMAPHORE_REGISTRY_URL" -u "$SEMAPHORE_REGISTRY_USERNAME" --password-stdin
            - 'docker pull "$SEMAPHORE_REGISTRY_URL/my-app:latest" || true'
            - 'docker build --cache-from "$SEMAPHORE_REGISTRY_URL/my-app:latest" -t "$SEMAPHORE_REGISTRY_URL/my-app:$SEMAPHORE_WORKFLOW_ID" .'
            - 'docker tag "$SEMAPHORE_REGISTRY_URL/my-app:$SEMAPHORE_WORKFLOW_ID" "$SEMAPHORE_REGISTRY_URL/my-app:latest"'
            - 'docker push "$SEMAPHORE_REGISTRY_URL/my-app:$SEMAPHORE_WORKFLOW_ID"'
            - 'docker push "$SEMAPHORE_REGISTRY_URL/my-app:latest"'
            - 'echo "Successfully pushed:"'
            - 'echo "$SEMAPHORE_REGISTRY_URL/my-app:$SEMAPHORE_WORKFLOW_ID"'
            - 'echo "$SEMAPHORE_REGISTRY_URL/my-app:latest"'
  - name: Deploy
    dependencies:
      - Публикация Docker образа
    task:
      jobs:
        - name: Deploy application
          commands:
            - 'echo "Deploy image:"'
            - 'echo "$SEMAPHORE_REGISTRY_URL/my-app:$SEMAPHORE_WORKFLOW_ID"'
