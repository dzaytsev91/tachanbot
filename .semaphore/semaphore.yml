version: v1.0
name: CI/CD пайплайн
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
global_job_config:
  prologue:
    commands:
      - checkout
      - cache restore python-deps-$(checksum requirements.txt)-$(checksum requirements.dev.txt)
blocks:
  - name: Docker сборка и тестирование
    task:
      jobs:
        - name: Build и test в Docker
          commands:
            - 'docker build -t my-app:$SEMAPHORE_WORKFLOW_ID .'
  - name: Публикация Docker образа в Docker Hub
    task:
      secrets:
        - name: DOCKER_LOGIN
        - name: DOCKER_PASS
      jobs:
        - name: Push в Docker Hub
          commands:
            - echo $DOCKER_PASS | docker login -u $DOCKER_LOGIN --password-stdin
            - 'docker pull $DOCKER_LOGIN/my-app:latest || true'
            - 'docker build --cache-from $DOCKER_LOGIN/my-app:latest -t $DOCKER_LOGIN/my-app:$SEMAPHORE_WORKFLOW_ID .'
            - 'docker tag $DOCKER_LOGIN/my-app:$SEMAPHORE_WORKFLOW_ID $DOCKER_LOGIN/my-app:latest'
            - 'docker push $DOCKER_LOGIN/my-app:$SEMAPHORE_WORKFLOW_ID'
            - 'docker push $DOCKER_LOGIN/my-app:latest'
            - 'echo "✅ Образ успешно загружен: $DOCKER_LOGIN/my-app:$SEMAPHORE_WORKFLOW_ID"'
            - 'echo "✅ Образ успешно загружен: $DOCKER_LOGIN/my-app:latest"'
  - name: (Опционально) Деплой
    task:
      jobs:
        - name: Деплой приложения
          commands:
            - "echo \"\U0001F680 Деплой образа $DOCKER_LOGIN/my-app:$SEMAPHORE_WORKFLOW_ID\""
