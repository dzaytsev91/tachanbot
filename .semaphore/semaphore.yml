version: v1.0
name: CI/CD пайплайн
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
global_job_config:
  prologue:
    commands:
      - checkout
blocks:
  - name: Docker сборка и тестирование
    task:
      jobs:
        - name: Build и test
          commands:
            - 'docker build -t my-app:$SEMAPHORE_WORKFLOW_ID .'
  - name: Публикация Docker образа
    task:
      jobs:
        - name: Push
          commands:
            - test -n "$SEMAPHORE_REGISTRY_PASSWORD"
            - echo "$SEMAPHORE_REGISTRY_PASSWORD" | docker login "$SEMAPHORE_REGISTRY_URL" -u "$SEMAPHORE_REGISTRY_USERNAME" --password-stdin
            - 'docker tag my-app:$SEMAPHORE_WORKFLOW_ID "$SEMAPHORE_REGISTRY_URL/my-app:$SEMAPHORE_WORKFLOW_ID"'
            - 'docker tag my-app:$SEMAPHORE_WORKFLOW_ID "$SEMAPHORE_REGISTRY_URL/my-app:latest"'
            - 'docker push "$SEMAPHORE_REGISTRY_URL/my-app:$SEMAPHORE_WORKFLOW_ID"'
            - 'docker push "$SEMAPHORE_REGISTRY_URL/my-app:latest"'
