version: v1.0
name: CI/CD пайплайн
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
global_job_config:
  prologue:
    commands:
      - checkout
      - cache restore python-deps-$(checksum requirements.txt)-$(checksum requirements.dev.txt)
blocks:
  - name: Установка зависимостей
    task:
      jobs:
        - name: Setup и кеширование
          commands:
            - python3 -m venv venv
            - venv/bin/pip install -r requirements.txt
            - venv/bin/pip install -r requirements.dev.txt
            - cache store python-deps-$(checksum requirements.txt)-$(checksum requirements.dev.txt) venv
  - name: Качество кода и тесты
    task:
      jobs:
        - name: Format и Test
          commands:
            - source venv/bin/activate
            - make format
            - make pre-commit || true
            - make test
  - name: Docker сборка и тестирование
    task:
      jobs:
        - name: Build и test в Docker
          commands:
            - 'docker build -t my-app:$SEMAPHORE_WORKFLOW_ID .'
            - 'docker run --rm my-app:$SEMAPHORE_WORKFLOW_ID make test'
  - name: Публикация Docker образа
    task:
      secrets:
        - name: dockerhub-credentials
      jobs:
        - name: Push в Docker Hub
          commands:
            - 'echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin'
            - 'docker pull ${DOCKER_USERNAME}/my-app:latest || true'
            - 'docker build --cache-from ${DOCKER_USERNAME}/my-app:latest -t ${DOCKER_USERNAME}/my-app:$SEMAPHORE_WORKFLOW_ID .'
            - 'docker tag ${DOCKER_USERNAME}/my-app:$SEMAPHORE_WORKFLOW_ID ${DOCKER_USERNAME}/my-app:latest'
            - 'docker push ${DOCKER_USERNAME}/my-app:$SEMAPHORE_WORKFLOW_ID'
            - 'docker push ${DOCKER_USERNAME}/my-app:latest'
